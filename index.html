<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Workout Tracker</title>

<!-- Home screen / PWA behavior -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workouts">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<style>
  :root{
    --bg:#0f1115;
    --bg-elev:#171a21;
    --bg-elev-2:#1f232c;
    --border:#2a2f3a;
    --text:#eef0f4;
    --text-dim:#9aa2b1;
    --accent:#5b8cff;
    --accent-dim:#33406b;
    --danger:#ff5c5c;
    --danger-dim:#3a2226;
    --good:#4ade80;
    --radius:14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    --tabbar-h: 70px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  html{color-scheme:dark;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none;
  }
  #app{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
  }
  header{
    padding: calc(14px + var(--safe-top)) 18px 12px;
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:5;
    border-bottom:1px solid var(--border);
  }
  header h1{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header .subtitle{
    margin-top:2px;
    font-size:13px;
    color:var(--text-dim);
  }
  main{
    flex:1;
    padding: 16px 16px calc(90px + var(--safe-bottom));
    max-width:640px;
    width:100%;
    margin:0 auto;
  }
  .view{display:none;}
  .view.active{display:block;}

  /* Bottom nav */
  nav.tabbar{
    position:fixed;
    left:0;right:0;bottom:0;
    display:flex;
    background:rgba(23,26,33,0.92);
    backdrop-filter: blur(14px);
    border-top:1px solid var(--border);
    padding-bottom: var(--safe-bottom);
    z-index:10;
  }
  nav.tabbar button{
    flex:1;
    min-width:0;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:10px;
    font-weight:600;
    padding:10px 2px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-family:inherit;
    white-space:nowrap;
  }
  nav.tabbar button .ic{font-size:20px;line-height:1;}
  nav.tabbar button.active{color:var(--accent);}

  h2.section-title{
    font-size:15px;
    font-weight:700;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:0 0 10px;
  }

  /* Cards */
  .card{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
  }

  label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
    font-weight:600;
  }
  input[type="text"], input[type="number"], input[type="date"], select{
    width:100%;
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 12px;
    font-size:16px;
    font-family:inherit;
    outline:none;
    height:44px;
    line-height:1.2;
  }
  input:focus, select:focus{border-color:var(--accent);}
  input[type="date"]{
    -webkit-appearance:none;
    appearance:none;
    min-height:44px;
    box-sizing:border-box;
  }
  input[type="date"]::-webkit-date-and-time-value{
    text-align:left;
    min-height:20px;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:10px;
    padding:12px 16px;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:#0b1020; width:100%;}
  .btn-secondary{background:var(--bg-elev-2); color:var(--text); border:1px solid var(--border);}
  .btn-danger{background:var(--danger-dim); color:var(--danger);}
  .btn-ghost{background:none; color:var(--accent); padding:8px 6px;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 10px; font-size:13px; border-radius:8px;}

  .row{display:flex; gap:10px;}
  .row > *{flex:1;}

  .exercise-block{
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
  }
  .exercise-block-head{
    display:flex;
    gap:8px;
    align-items:flex-start;
    margin-bottom:10px;
  }
  .exercise-block-head input{flex:1;}
  .remove-x{
    background:var(--danger-dim);
    color:var(--danger);
    border:none;
    border-radius:8px;
    width:40px;
    height:40px;
    font-size:16px;
    font-weight:700;
    flex-shrink:0;
  }
  .set-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .set-row .set-idx{
    width:22px;
    text-align:center;
    color:var(--text-dim);
    font-size:12px;
    font-weight:700;
    flex-shrink:0;
  }
  .set-row input{flex:1;}
  .set-row .remove-set{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:18px;
    width:30px;
    flex-shrink:0;
  }
  .add-set-btn{
    width:100%;
    background:none;
    border:1px dashed var(--border);
    color:var(--accent);
    border-radius:8px;
    padding:8px;
    font-size:13px;
    font-weight:700;
    font-family:inherit;
    margin-top:2px;
  }

  .empty-state{
    text-align:center;
    color:var(--text-dim);
    padding:60px 20px;
    font-size:14px;
    line-height:1.6;
  }
  .empty-state .big{font-size:34px; margin-bottom:8px;}

  /* History */
  .session-card{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
  }
  .session-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px;
    cursor:pointer;
  }
  .session-head .date{font-weight:700; font-size:15px;}
  .session-head .meta{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .session-head .vol{font-size:14px; color:var(--accent); font-weight:700; text-align:right;}
  .session-body{
    display:none;
    padding:0 14px 14px;
    border-top:1px solid var(--border);
  }
  .session-body.open{display:block;}
  .ex-row{padding:10px 0; border-bottom:1px solid var(--border);}
  .ex-row:last-child{border-bottom:none;}
  .ex-row .ex-name{font-weight:700; font-size:14px; margin-bottom:4px; display:flex; justify-content:space-between;}
  .ex-row .ex-name .vol{color:var(--text-dim); font-weight:600; font-size:12px;}
  .ex-row .sets{font-size:13px; color:var(--text-dim);}
  .session-actions{padding-top:10px; display:flex; justify-content:flex-end;}

  /* Charts */
  .chart-session-count{
    font-size:12px;
    color:var(--text-dim);
    text-align:center;
    margin-bottom:12px;
  }
  .chart-card{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
  }
  .chart-card-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
    margin-bottom:10px;
  }
  .chart-card-title{
    font-size:13px;
    font-weight:800;
    color:var(--text);
  }
  .chart-card-stats{
    font-size:12px;
    color:var(--text-dim);
    text-align:right;
    white-space:nowrap;
  }
  .chart-card-stats strong{color:var(--text); font-weight:700;}
  .chart-wrap-sm{
    position:relative;
    height:170px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:calc(96px + var(--safe-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--good);
    color:#0b1020;
    padding:10px 18px;
    border-radius:30px;
    font-weight:700;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:50;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Sets table (Set / Prev / Weight / Reps) */
  .sets-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 2px 6px;
    font-size:10px;
    font-weight:700;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .sets-header .set-idx{width:22px; flex-shrink:0; text-align:center;}
  .sets-header .col-prev{flex:1; min-width:0;}
  .sets-header .col-weight{flex:1;}
  .sets-header .col-reps{flex:1;}
  .sets-header .col-remove{width:30px; flex-shrink:0;}

  .set-row .prev-val{
    flex:1;
    font-size:13px;
    color:var(--text-dim);
    text-align:center;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* Notes */
  .notes-row{margin-top:6px;}
  .notes-row input{font-size:14px;}
  .ex-notes{
    font-size:12px;
    color:var(--text-dim);
    margin-top:4px;
    font-style:italic;
  }

  /* Routine builder exercise rows */
  .rex-sets{
    flex:0 0 64px !important;
    text-align:center;
  }

  /* Exercise name autocomplete dropdown (custom-built — iOS Safari's native
     <datalist> suggestions are unreliable, so this drives its own list instead) */
  .autocomplete-box{
    position:fixed;
    z-index:200;
    display:none;
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    border-radius:10px;
    max-height:190px;
    overflow-y:auto;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
  }
  .autocomplete-box .ac-item{
    padding:11px 12px;
    font-size:14px;
    color:var(--text);
    border-bottom:1px solid var(--border);
  }
  .autocomplete-box .ac-item:last-child{border-bottom:none;}
  .autocomplete-box .ac-item:active{background:var(--bg-elev);}

  /* Workout Screen sticky header (app header is hidden while this is showing,
     so this sticks to the very top of the viewport and handles its own safe-area padding) */
  .workout-sticky-header{
    position:sticky;
    top:0;
    z-index:4;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    margin:-16px -16px 14px;
    padding:calc(14px + var(--safe-top)) 16px 12px;
  }
  .workout-routine-name{
    font-size:16px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .workout-meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:4px;
  }
  .workout-meta-row .wk-date{
    font-size:12px;
    color:var(--text-dim);
    font-weight:600;
  }
  .workout-timer{
    font-variant-numeric:tabular-nums;
    font-size:15px;
    font-weight:800;
    color:var(--accent);
    background:rgba(91,140,255,0.12);
    border:1px solid var(--accent-dim);
    border-radius:20px;
    padding:3px 12px;
  }

  #workoutScreen{padding-bottom:8px;}

  /* Fixed End Workout button */
  #endWorkoutBtn{
    display:none;
    align-items:center;
    justify-content:center;
    position:fixed;
    left:16px;
    right:16px;
    bottom:calc(var(--tabbar-h, 70px) + 12px + var(--safe-bottom));
    max-width:608px;
    margin:0 auto;
    z-index:9;
    background:var(--danger);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:16px;
    font-size:16px;
    font-weight:800;
    font-family:inherit;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="headerTitle">Workout Tracker</h1>
    <div class="subtitle" id="headerSubtitle">Log today's session</div>
  </header>

  <main>
    <!-- LOG VIEW (Workout tab) -->
    <section id="view-log" class="view active">

      <!-- PRE-WORKOUT SCREEN -->
      <div id="preWorkoutScreen">
        <div class="card">
          <label for="routineSelect">Routine (optional)</label>
          <select id="routineSelect">
            <option value="">— None / Freestyle —</option>
          </select>
        </div>

        <div class="card">
          <label for="sessionDate">Date</label>
          <input type="date" id="sessionDate" autocomplete="off">
        </div>

        <button class="btn btn-primary btn-block" id="startWorkoutBtn">Start Workout</button>
      </div>

      <!-- WORKOUT SCREEN -->
      <div id="workoutScreen" style="display:none;">
        <div class="workout-sticky-header">
          <div class="workout-routine-name" id="activeRoutineName">Freestyle Workout</div>
          <div class="workout-meta-row">
            <span class="wk-date" id="activeWorkoutDate"></span>
            <span class="workout-timer" id="workoutTimer">00:00</span>
          </div>
        </div>

        <div id="exerciseList"></div>

        <button class="btn btn-secondary btn-block" id="addExerciseBtn">+ Add Exercise</button>
        <div style="height:90px;"></div>
      </div>
    </section>

    <button id="endWorkoutBtn">End Workout</button>

    <!-- ROUTINES VIEW -->
    <section id="view-routines" class="view">
      <div id="routineList"></div>
      <button class="btn btn-secondary btn-block" id="newRoutineBtn">+ New Routine</button>

      <div id="routineEditor" class="card" style="display:none; margin-top:14px;">
        <label for="routineNameInput">Routine Name</label>
        <input type="text" id="routineNameInput" placeholder="e.g. Push Day">
        <div style="height:12px;"></div>
        <label>Exercises</label>
        <div id="routineExerciseList"></div>
        <button class="add-set-btn" id="addRoutineExerciseBtn" style="margin-top:2px;">+ Add Exercise</button>
        <div class="row" style="margin-top:14px;">
          <button class="btn btn-secondary" id="cancelRoutineBtn">Cancel</button>
          <button class="btn btn-primary" id="saveRoutineBtn">Save Routine</button>
        </div>
      </div>
    </section>

    <!-- EXERCISES VIEW -->
    <section id="view-exercises" class="view">
      <div class="card">
        <label for="newExerciseInput">Add an exercise</label>
        <input type="text" id="newExerciseInput" placeholder="e.g. Cable Fly">
        <button class="btn btn-primary btn-block" id="addLibraryExerciseBtn" style="margin-top:10px;">Add</button>
      </div>
      <div id="exerciseLibraryList"></div>
    </section>

    <!-- HISTORY VIEW -->
    <section id="view-history" class="view">
      <div class="card">
        <label>Backup &amp; Export</label>
        <div class="row" style="margin-top:8px;">
          <button class="btn btn-secondary btn-sm" id="exportJsonBtn">Download Backup (JSON)</button>
          <button class="btn btn-secondary btn-sm" id="exportCsvBtn">Download CSV</button>
        </div>
        <button class="btn btn-secondary btn-sm btn-block" id="importJsonBtn" style="margin-top:8px;">Restore from Backup</button>
        <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;">
      </div>
      <div id="historyList"></div>
    </section>

    <!-- CHARTS VIEW -->
    <section id="view-charts" class="view">
      <div class="card">
        <label for="chartExerciseSelect">Exercise</label>
        <select id="chartExerciseSelect"></select>
      </div>
      <div id="chartArea"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-view="log">
      <span class="ic">📝</span><span>Workout</span>
    </button>
    <button class="tab-btn" data-view="routines">
      <span class="ic">📋</span><span>Routines</span>
    </button>
    <button class="tab-btn" data-view="exercises">
      <span class="ic">💪</span><span>Exercises</span>
    </button>
    <button class="tab-btn" data-view="history">
      <span class="ic">📜</span><span>History</span>
    </button>
    <button class="tab-btn" data-view="charts">
      <span class="ic">📈</span><span>Charts</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<datalist id="exerciseNames"></datalist>
<div id="autocompleteBox" class="autocomplete-box"></div>

<script>
  // Chart.js is loaded from a CDN. If the primary CDN is unreachable (network hiccup,
  // ad/content blocker, regional block), automatically try a couple of alternates
  // before giving up. This only needs to finish before the user opens the Charts tab,
  // so loading it this way (instead of a single blocking <script src>) is safe.
  (function loadChartJs(urls) {
    if (!urls.length) return;
    const s = document.createElement('script');
    s.src = urls[0];
    s.onload = () => window.dispatchEvent(new Event('chartjs-ready'));
    s.onerror = () => loadChartJs(urls.slice(1));
    document.head.appendChild(s);
  })([
    'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js',
    'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
    'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js',
  ]);
</script>
<script src="app.js"></script>
</body>
</html>
